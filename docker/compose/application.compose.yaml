services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.33.3}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  mcp:
    build:
      context: ../../apps/mcp
      dockerfile: Dockerfile
    image: linearmemory/mcp:${LINEARMEMORY_VERSION:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-linearmemory}
      PGUSER: ${POSTGRES_USER:-linearmemory}
      PGPASSWORD_FILE: /run/secrets/postgres-password
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CONFIG_ENCRYPTION_KEY_FILE: /run/secrets/postgres-password
      OLLAMA_URL: http://ollama:11434
    secrets:
      - postgres-password
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-3333}:3333"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    image: linearmemory/web:${LINEARMEMORY_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:8080"
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  ollama-data:
    name: linearmemory-ollama-data
